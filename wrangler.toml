name = "ce-entebbe-membership"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "ce_membership"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
