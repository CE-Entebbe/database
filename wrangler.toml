name = "ce-entebbe-membership"
main = "src/index.ts"
compatibility_date = "2025-09-01"

workers_dev = true
routes = [{ pattern = "app.ceentebbe.online", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "ce_membership"
database_id = "a9bbc41a-d52b-445b-86f6-dd5483c63668"
migrations_dir = "migrations"

# ADMIN_TOKEN is a secret: `npx wrangler secret put ADMIN_TOKEN`
# For local dev put ADMIN_TOKEN=... in .dev.vars

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "ce-member-photos"
